openapi: 3.0.0
info:
  title: Lnkcnt - URL Shortener API
  description: URL shortening and click tracking API
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Local Development
  - url: https://lnkcnt.example.com
    description: Production

paths:
  /api/url/shorten:
    post:
      summary: Create a shortened URL
      description: Creates a new shortened URL and returns the generated ID and management page token.
      tags:
        - URL Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShortenRequest"
            example:
              url: https://www.example.com/very/long/url/path
      responses:
        "201":
          description: URL successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShortenResponse"
              example:
                message: URL generated successfully.
                success: true
                generatedId: "abc123xyz789"
                managePage: "m1a2b3c4d5e6f7g8h9i0j1k2l3m4n5o6p"
        "400":
          description: Invalid JSON body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: Invalid JSON body
                errors:
                  errors: ["Invalid request body"]
                  properties: {}
        "422":
          description: URL validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: URL is invalid
                errors:
                  errors: ["Invalid input"]
                  properties:
                    url: ["Invalid URL format"]
        "403":
          description: URL is on the blacklist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: This URL is not allowed
                errors:
                  errors: ["URL matches blacklist rule"]
                  properties: {}

  /api/url/manage:
    get:
      summary: Retrieve link details and click history
      description: Retrieves detailed information and click records for a shortened link using the management page token.
      tags:
        - URL Management
      parameters:
        - name: id
          in: query
          required: true
          description: Management page token
          schema:
            type: string
            minLength: 32
            maxLength: 32
            pattern: "^[a-z0-9_-]{32}$"
          example: m1a2b3c4d5e6f7g8h9i0j1k2l3m4n5o6p
      responses:
        "200":
          description: Link information retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManageResponse"
        "400":
          description: Required query parameter missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "Bad Request: id required"
                status: 400
        "404":
          description: Management page token or link not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Link not found
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/url/delete:
    post:
      summary: Delete a shortened URL
      description: Deletes a shortened URL using the management page token.
      tags:
        - URL Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteRequest"
            example:
              id: m1a2b3c4d5e6f7g8h9i0j1k2l3m4n5o6p
      responses:
        "200":
          description: URL successfully deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "URL deleted successfully"
                  success:
                    type: boolean
                    example: true
        "400":
          description: Invalid JSON body or ID format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: Invalid JSON body
        "404":
          description: Management page token not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Manage page not found
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/charts:
    get:
      summary: Retrieve daily click aggregates
      description: Retrieves daily click counts for a shortened link within a specified date range.
      tags:
        - Analytics
      parameters:
        - name: id
          in: query
          required: true
          description: Shortened link ID
          schema:
            type: string
          example: abc123xyz789
        - name: startYear
          in: query
          required: true
          description: Start year
          schema:
            type: integer
            example: 2024
        - name: startMonth
          in: query
          required: true
          description: Start month (0-11, JavaScript Date format)
          schema:
            type: integer
            minimum: 0
            maximum: 11
            example: 0
        - name: endYear
          in: query
          required: false
          description: End year (defaults to current year if not specified)
          schema:
            type: integer
            example: 2024
        - name: endMonth
          in: query
          required: false
          description: End month (0-11, JavaScript Date format; defaults to current month if not specified)
          schema:
            type: integer
            minimum: 0
            maximum: 11
            example: 2
      responses:
        "200":
          description: Daily click aggregates retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartsResponse"
              example:
                data:
                  - date: "2024-01-01"
                    sum: 15
                  - date: "2024-01-02"
                    sum: 23
                  - date: "2024-01-03"
                    sum: 8
        "400":
          description: Required query parameter missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "Bad Request: startYear and startMonth is required"
                status: 400

  /api/report:
    post:
      summary: Submit a URL report
      description: Reports a malicious or inappropriate shortened URL.
      tags:
        - Reports
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportRequest"
            example:
              id: abc123xyz789
              reason: phishing
              message: This URL is phishing content
      responses:
        "200":
          description: Report successfully submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"
              example:
                success: true
                reportId: "rpt_1a2b3c4d5e6f7g8h"
        "400":
          description: Missing required fields or validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Missing required fields
        "404":
          description: Target link not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Link not found
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Internal server error

components:
  schemas:
    ShortenRequest:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          description: Original URL to be shortened

    ShortenResponse:
      type: object
      properties:
        message:
          type: string
          description: Response message
        success:
          type: boolean
          description: Success status
        generatedId:
          type: string
          description: Generated shortened ID
        managePage:
          type: string
          description: Management page token (32-character nanoid)

    DeleteRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          pattern: "^[a-z0-9_-]{32}$"
          description: Management page token

    ManageResponse:
      type: object
      properties:
        success:
          type: boolean
        link:
          type: object
          properties:
            id:
              type: string
              description: Shortened link ID
            redirect_url:
              type: string
              description: Original URL
            created_at:
              type: string
              format: date-time
              description: Creation timestamp
        clicks:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
                description: Click occurrence date
              count:
                type: integer
                description: Number of clicks on that date

    ChartsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            required:
              - date
              - sum
            properties:
              date:
                type: string
                format: date
                pattern: '^\d{4}-\d{2}-\d{2}$'
                description: Date in YYYY-MM-DD format
              sum:
                type: integer
                description: Number of clicks on that date

    ReportRequest:
      type: object
      required:
        - id
        - reason
        - message
      properties:
        id:
          type: string
          format: nanoid
          description: Shortened link ID to report
        reason:
          type: string
          enum:
            - phishing
            - malware
            - spam
            - redirectloop
            - unaccessible
            - adult
            - harassment
            - violence
            - illegal
            - other
          description: Report reason
        message:
          type: string
          minLength: 1
          maxLength: 300
          description: Detailed report message

    ReportResponse:
      type: object
      required:
        - success
        - reportId
      properties:
        success:
          type: boolean
        reportId:
          type: string
          description: Generated report ID

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        error:
          type: string
        status:
          type: integer
        errors:
          type: object
          properties:
            errors:
              type: array
              items:
                type: string
            properties:
              type: object
